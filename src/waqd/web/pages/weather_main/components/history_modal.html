<!-- Generic History Modal for Time-Series Data -->
<dialog id="history-modal" class="modal overflow-hidden">
  <div class="modal-box overflow-hidden" style="width: 90vw !important; max-width: 90vw !important; height: 95vh !important; max-height: 95vh !important; padding-right: 3.5rem !important;">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
    <div class="flex justify-between items-center mb-6">
      <h3 id="history-modal-title" class="font-bold text-4xl">{{ t('history_modal_title') }}</h3>
      <select id="history-time-range" class="select text-2xl">
        <option value="6" selected>{{ t('history_last_6_hours') }}</option>
        <option value="12">{{ t('history_last_12_hours') }}</option>
        <option value="24">{{ t('history_last_24_hours') }}</option>
        <option value="48">{{ t('history_last_48_hours') }}</option>
        <option value="168">{{ t('history_last_7_days') }}</option>
        <option value="720">{{ t('history_last_30_days') }}</option>
      </select>
    </div>
    
    <div class="w-full" style="height: calc(95vh - 110px);">
      <div id="history-chart" style="width: 100%; height: 100%;"></div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>

<script src="/static/js/highcharts_12_4_0.js"></script>
<script>
  // Translation strings injected from server
  const historyTranslations = {
    loading: "{{ t('history_loading') }}",
    time: "{{ t('time') }}",
    interior: {
      temperature: {
        title: "{{ t('history_interior_temperature') }}",
        label: "{{ t('temperature') }}",
        yAxis: "{{ t('temperature') }} (°C)"
      },
      humidity: {
        title: "{{ t('history_interior_humidity') }}",
        label: "{{ t('humidity') }}",
        yAxis: "{{ t('humidity') }} (%)"
      },
      co2: {
        title: "{{ t('history_interior_co2') }}",
        label: "{{ t('co2') }}",
        yAxis: "{{ t('co2') }} (ppm)"
      },
      pressure: {
        title: "{{ t('history_interior_pressure') }}",
        label: "{{ t('pressure') }}",
        yAxis: "{{ t('pressure') }} (hPa)"
      }
    },
    exterior: {
      temperature: {
        title: "{{ t('history_exterior_temperature') }}",
        label: "{{ t('temperature') }}",
        yAxis: "{{ t('temperature') }} (°C)"
      },
      humidity: {
        title: "{{ t('history_exterior_humidity') }}",
        label: "{{ t('humidity') }}",
        yAxis: "{{ t('humidity') }} (%)"
      }
    }
  };

  // Generic history chart manager
  const HistoryChart = {
    chart: null,
    currentConfig: null,

    // Initialize or update the chart with new data
    async show(config) {
      this.currentConfig = config;
      const modal = document.getElementById('history-modal');
      const title = document.getElementById('history-modal-title');
      const container = document.getElementById('history-chart');

      // Update title
      title.textContent = config.title || 'Data History';

      // Show modal immediately with loading state
      modal.showModal();

      // Show loading state
      this.showLoading(container);

      // Get time range
      const timeRange = parseInt(document.getElementById('history-time-range').value);
      
      // Generate data based on time range (await the promise)
      const data = await this.generateData(timeRange, config);

      // Destroy existing chart if any
      if (this.chart) {
        this.chart.destroy();
      }

      // Prepare data for Highcharts (array of [timestamp, value])
      const seriesData = data.timestamps.map((timestamp, index) => [timestamp, data.values[index]]);

      // Create new Highcharts chart
      this.chart = Highcharts.chart('history-chart', {
        chart: {
          type: 'line',
          backgroundColor: 'transparent',
          style: {
            fontFamily: 'inherit'
          }
        },
        title: {
          text: null
        },
        xAxis: {
          type: 'datetime',
          title: {
            text: historyTranslations.time,
            style: {
              fontSize: '14px',
              color: 'rgba(255, 255, 255, 0.9)'
            }
          },
          dateTimeLabelFormats: {
            millisecond: '%H:%M:%S',
            second: '%H:%M:%S',
            minute: '%H:%M',
            hour: '%H:%M',
            day: '%m/%d<br/>%H:%M',
            week: '%m/%d',
            month: '%m/%Y',
            year: '%Y'
          },
          labels: {
            style: {
              fontSize: '12px',
              color: 'rgba(255, 255, 255, 0.9)'
            }
          }
        },
        yAxis: {
          title: {
            text: config.yAxisLabel || 'Value',
            style: {
              fontSize: '14px',
              color: 'rgba(255, 255, 255, 0.9)'
            }
          },
          labels: {
            formatter: function() {
              return this.value.toFixed(1) + (config.unit || '');
            },
            style: {
              fontSize: '12px',
              color: 'rgba(255, 255, 255, 0.9)'
            }
          }
        },
        legend: {
          enabled: false
        },
        tooltip: {
          shared: true,
          crosshairs: true,
          xDateFormat: '%Y-%m-%d %H:%M',
          valueSuffix: config.unit || '',
          valueDecimals: 1,
          style: {
            fontSize: '13px'
          }
        },
        plotOptions: {
          line: {
            marker: {
              enabled: false,
              states: {
                hover: {
                  enabled: true,
                  radius: 5
                }
              }
            },
            lineWidth: 2
          },
          series: {
            fillOpacity: 0.1
          }
        },
        series: [{
          name: config.label || 'Value',
          data: seriesData,
          color: config.color || 'rgb(75, 192, 192)',
          fillColor: config.backgroundColor || 'rgba(75, 192, 192, 0.1)',
          type: 'areaspline'
        }],
        credits: {
          enabled: false
        }
      });
    },

    showLoading(container) {
      // Show loading message in container
      container.innerHTML = `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 20px; color: #666;">${historyTranslations.loading}</div>`;
    },

    // Fetch data from API or use hardcoded generator
    async generateData(hours, config) {
      // If API endpoint is provided, fetch real data
      if (config.apiEndpoint) {
        try {
          const response = await fetch(
            `${config.apiEndpoint}?sensor_location=${config.sensorLocation}&sensor_type=${config.sensorType}&hours=${hours}`
          );
          if (!response.ok) {
            throw new Error('Failed to fetch sensor data');
          }
          const apiData = await response.json();
          
          const values = [];
          const timestamps = [];
          
          for (const point of apiData.data) {
            const date = new Date(point.timestamp);
            timestamps.push(date.getTime());
            values.push(point.value);
          }
          
          return { values, timestamps };
        } catch (error) {
          console.error('Error fetching sensor history:', error);
          // Fall back to generated data
        }
      }
      
      // Fallback: generate hardcoded data for prototype
      const now = new Date();
      const values = [];
      const timestamps = [];
      const dataPoints = hours * 6; // One point every 10 minutes

      // Use config.dataGenerator if provided, otherwise use default
      const generator = config.dataGenerator || this.defaultDataGenerator;

      for (let i = 0; i <= dataPoints; i++) {
        const time = new Date(now - (dataPoints - i) * 10 * 60 * 1000);
        timestamps.push(time.getTime());
        values.push(generator(i, dataPoints, config));
      }

      return { values, timestamps };
    },

    // Default data generator (sinusoidal pattern with noise)
    defaultDataGenerator(index, total, config) {
      const baseValue = config.baseValue || 20;
      const amplitude = config.amplitude || 3;
      const noise = (Math.random() - 0.5) * 0.5;
      return baseValue + Math.sin(index / total * Math.PI * 2) * amplitude + noise;
    },

    // Update chart when time range changes
    updateTimeRange() {
      if (this.currentConfig) {
        this.show(this.currentConfig);
      }
    }
  };

  // Listen for time range changes
  document.getElementById('history-time-range').addEventListener('change', function() {
    HistoryChart.updateTimeRange();
  });

  // Functions to show sensor history for different sensors
  function showTemperatureHistory() {
    const t = historyTranslations.interior.temperature;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: '°C',
      yAxisLabel: t.yAxis,
      color: 'rgb(255, 99, 132)',
      backgroundColor: 'rgba(255, 99, 132, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'interior',
      sensorType: 'temp_degC',
    });
  }

  function showHumidityHistory() {
    const t = historyTranslations.interior.humidity;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: '%',
      yAxisLabel: t.yAxis,
      color: 'rgb(54, 162, 235)',
      backgroundColor: 'rgba(54, 162, 235, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'interior',
      sensorType: 'humidity_%',
    });
  }

  function showCO2History() {
    const t = historyTranslations.interior.co2;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: ' ppm',
      yAxisLabel: t.yAxis,
      color: 'rgb(75, 192, 75)',
      backgroundColor: 'rgba(75, 192, 75, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'interior',
      sensorType: 'CO2_ppm',
    });
  }

  function showPressureHistory() {
    const t = historyTranslations.interior.pressure;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: ' hPa',
      yAxisLabel: t.yAxis,
      color: 'rgb(153, 102, 255)',
      backgroundColor: 'rgba(153, 102, 255, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'interior',
      sensorType: 'pressure_hPa',
    });
  }

  function showExteriorTemperatureHistory() {
    const t = historyTranslations.exterior.temperature;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: '°C',
      yAxisLabel: t.yAxis,
      color: 'rgb(255, 159, 64)',
      backgroundColor: 'rgba(255, 159, 64, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'exterior',
      sensorType: 'temp_degC',
    });
  }

  function showExteriorHumidityHistory() {
    const t = historyTranslations.exterior.humidity;
    HistoryChart.show({
      title: t.title,
      label: t.label,
      unit: '%',
      yAxisLabel: t.yAxis,
      color: 'rgb(201, 203, 207)',
      backgroundColor: 'rgba(201, 203, 207, 0.1)',
      apiEndpoint: '/api/sensor/v1/history',
      sensorLocation: 'exterior',
      sensorType: 'humidity_%',
    });
  }

  //# sourceURL=history_modal.html
</script>
