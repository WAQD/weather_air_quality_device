<div class="modal-box" style="height: 100%; width: 95%; max-width: 95%;">
    <!-- close button -->
    <form method="dialog">
        <button class="btn btn-md btn-circle btn-ghost text-lg absolute right-2 top-2">✕</button>
    </form>
        <p id="chartContainer" class="mt-2 p-1" style="height: 500px;">{{ t('forecast_chart') }}</p>

        <script>
            // Inject translations for JS
            const forecast_i18n = {
                chartTitle: "{{ t('weekly_weather_forecast') }}",
                tooltip: "{{ t('forecast_tooltip') }}",
                weekdays: [
                    "{{ t('monday') }}",
                    "{{ t('tuesday') }}",
                    "{{ t('wednesday') }}",
                    "{{ t('thursday') }}",
                    "{{ t('friday') }}",
                    "{{ t('saturday') }}",
                    "{{ t('sunday') }}"
                ],
                weather: {
                    rainy: "{{ t('rainy') }}",
                    sunny: "{{ t('sunny') }}",
                    cloudy: "{{ t('cloudy') }}"
                }
            };
        </script>

</div>
<script>
    // modal.addEventListener('dialogshow', function () {
    // function showChart() {
    console.log("Hello from forecast_1.html");
    var chart = new CanvasJS.Chart("chartContainer", {
        title: {
            text: forecast_i18n.chartTitle,
            fontFamily: "MyFranzo",
        },
        axisX: {
            labelFontFamily: "MyFranzo",
            labelFontSize: 16,
        },
        axisY: {
            suffix: " °C",
            maximum: 40,
            gridThickness: 0,
            labelFontFamily: "MyFranzo",
            labelFontSize: 18,
        },
        toolTip: {
            shared: true,
            content: forecast_i18n.tooltip
        },
        data: [{
            type: "rangeSplineArea",
            fillOpacity: 0.1,
            color: "#91AAB1",
            indexLabelFontSize: 20,
            indexLabelFontFamily: "MyFranzo",
            indexLabelFormatter: formatter,
            dataPoints: [
                { label: forecast_i18n.weekdays[0], y: [15, 26], name: forecast_i18n.weather.rainy },
                { label: forecast_i18n.weekdays[1], y: [15, 27], name: forecast_i18n.weather.rainy },
                { label: forecast_i18n.weekdays[2], y: [13, 27], name: forecast_i18n.weather.sunny },
                { label: forecast_i18n.weekdays[3], y: [14, 27], name: forecast_i18n.weather.sunny },
                { label: forecast_i18n.weekdays[4], y: [15, 26], name: forecast_i18n.weather.cloudy },
                { label: forecast_i18n.weekdays[5], y: [17, 26], name: forecast_i18n.weather.sunny },
                { label: forecast_i18n.weekdays[6], y: [16, 27], name: forecast_i18n.weather.rainy }
            ]
        }]
    });
    chart.render();

    var images = [];

    addImages(chart);

    function addImages(chart) {
        for (var i = 0; i < chart.data[0].dataPoints.length; i++) {
            var dpsName = chart.data[0].dataPoints[i].name;
            if (dpsName == "cloudy") {
                images.push($("<img>").attr("src", "https://canvasjs.com/wp-content/uploads/images/gallery/gallery-overview/cloudy.png"));
            } else if (dpsName == "rainy") {
                images.push($("<img>").attr("src", "https://canvasjs.com/wp-content/uploads/images/gallery/gallery-overview/rainy.png"));
            } else if (dpsName == "sunny") {
                images.push($("<img>").attr("src", "https://canvasjs.com/wp-content/uploads/images/gallery/gallery-overview/sunny.png"));
            }

            images[i].attr("class", dpsName).appendTo($("#chartContainer>.canvasjs-chart-container"));
            positionImage(images[i], i);
        }
    }

    function positionImage(image, index) {
        var imageCenter = chart.axisX[0].convertValueToPixel(chart.data[0].dataPoints[index].x);
        var imageTop = chart.axisY[0].convertValueToPixel(chart.axisY[0].maximum);

        image.width("40px")
            .css({
                "left": imageCenter - 20 + "px",
                "position": "absolute", "top": imageTop + "px",
                "position": "absolute"
            });
    }

    $(window).resize(function () {
        var cloudyCounter = 0, rainyCounter = 0, sunnyCounter = 0;
        var imageCenter = 0;
        for (var i = 0; i < chart.data[0].dataPoints.length; i++) {
            imageCenter = chart.axisX[0].convertValueToPixel(chart.data[0].dataPoints[i].x) - 20;
            if (chart.data[0].dataPoints[i].name == "cloudy") {
                $(".cloudy").eq(cloudyCounter++).css({ "left": imageCenter });
            } else if (chart.data[0].dataPoints[i].name == "rainy") {
                $(".rainy").eq(rainyCounter++).css({ "left": imageCenter });
            } else if (chart.data[0].dataPoints[i].name == "sunny") {
                $(".sunny").eq(sunnyCounter++).css({ "left": imageCenter });
            }
        }
    });

    function formatter(e) {
        if (e.index === 0 && e.dataPoint.x === 0) {
            return " Min " + e.dataPoint.y[e.index] + "°";
        } else if (e.index == 1 && e.dataPoint.x === 0) {
            return " Max " + e.dataPoint.y[e.index] + "°";
        } else {
            return e.dataPoint.y[e.index] + "°";
        }
    }

    // })
</script>
