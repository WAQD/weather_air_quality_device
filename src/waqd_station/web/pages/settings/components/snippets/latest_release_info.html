<div class="modal-box" x-data="{ updateLoading: false }">
    <h3 class="font-bold text-xl">{{ t('new_release_found', version=version) }}</h3>
    {% for line in content %}
    {% if line %}
    <p class="p-1 text-xl">{{line}}</p>
    {% endif %}
    {% endfor %}
    <p class="py-4 text-xl">{{ t('install_release_question') }}</p>
    <div class="modal-action">
        <form method="dialog">
            <button
                id="trigger-update-btn"
                class="btn btn-error flex items-center gap-2"
                hx-post="trigger_update"
                hx-swap="none"
                @click="updateLoading = true"
                hx-on:htmx:afterRequest="updateLoading = false"
                :disabled="updateLoading"
            >
                <span>{{ t('yes') }}</span>
                <span x-show="updateLoading" class="loading loading-xs loading-spinner ml-2"></span>
            </button>
            <button class="btn btn-ghost mr-2">{{ t('no') }}</button>
        </form>
    </div>
</div>
