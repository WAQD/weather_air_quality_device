<!-- need raw for htmx json substitution to work -->
<template id="Exterior-template">
  <div class="stat md:p-2"> 
    <!-- cursor-pointer hover:bg-base-200/50 transition-colors -->
    <!-- onclick="showExteriorTemperatureHistory()" -->
    <div class="stat-title">{{ t('temperature') }}</div>
    {% raw %}<div class="stat-value text-7xl tracking-tighter">{{temp}}</div>{% endraw %}
    <div class="stat-figure">
      <svg viewBox="0 0 24 24" class="h-18 -m-4 mt-2">
        <use href="/static/weather_icons/wi-thermometer_full.svg#Layer_1" fill="white" />
      </svg>
    </div>
  </div>
  <div class="stat md:p-2">
    <!-- cursor-pointer hover:bg-base-200/50 transition-colors -->
    <!-- onclick="showExteriorHumidityHistory()"> -->
    <div class="stat-title">{{ t('humidity') }}</div>
    {% raw %}<div class="stat-value text-5xl">{{hum}}</div>{% endraw %}
    <div class="stat-desc"></div>
    <div class="stat-figure">
      <svg viewBox="0 0 24 24" class="h-18">
        <use href="/static/weather_icons/wi-humidity.svg#Layer_1" fill="white" />
      </svg>
    </div>
  </div>
  <div class="stat md:p-2">
    <div class="stat-title">{{ t('weather_today') }}</div>
    <div class="stat-value md:-mb-2">
      <div class="grid grid-cols-[35%_15%_50%] grid-rows-2 items-stretch">
        <div class="row-span-2">
          <svg viewBox="0 0 48 48" class="h-26">
            {% raw %}
            <use href="/static/{{weather_icon}}#Layer_1" fill="white" />{% endraw %}
          </svg>
        </div>
        <div class="col-start-2 row-start-1 flex items-center">
          <svg viewBox="0 0 24 24" class="-m-1 h-12">
            <use href="/static/weather_icons/wi-day-sunny.svg#Layer_1" fill="white" />
          </svg>
        </div>
        <div class="col-start-3 row-start-1 text-3xl flex items-center text-white">
          {% raw %}{{weather_day_min_max}}{% endraw %}
        </div>
        <div class="col-start-2 row-start-2 flex items-center">
          <svg viewBox="0 0 24 24" class="-m-1 h-12">
            <use href="/static/weather_icons/wi-night-clear.svg#Layer_1" fill="white" />
          </svg>
        </div>
        <div class="col-start-3 row-start-2 text-3xl flex items-center text-white">
          {% raw %}{{weather_night_min_max}}{% endraw %}
        </div>
      </div>
    </div>
    <div class="stat-desc"></div>
    <div class="stat-figure"></div>
  </div>
</template>
