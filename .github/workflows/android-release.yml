name: Build & attach Android release

# Triggers:
#  - push of a v* tag (e.g. v0.10.1)
#  - manual run via the Actions tab (useful to re-attach after a build fix
#    without re-tagging)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of waqd-release.jks (no newlines)
#   ANDROID_KEYSTORE_PASSWORD   the storepass
#   ANDROID_KEY_PASSWORD        the keypass
#   ANDROID_KEY_ALIAS           the alias (e.g. "waqd")
#
# The keystore.properties file is generated from these secrets at build time
# and is NEVER committed. The keystore itself is backed up outside GitHub.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to attach the APK to (defaults to GITHUB_REF_NAME)"
                required: false
                type: string

permissions:
    contents: write # needed to create/update the GitHub Release and its assets

jobs:
    android:
        name: Build signed APK
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # ---------- Environment ----------
            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Set up Node 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: src/waqd_website/ui/package-lock.json

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            # ---------- Web build ----------
            - name: Install UI dependencies
              working-directory: src/waqd_website/ui
              run: npm ci

            # ---------- Versioning ----------
            # versionCode must be monotonically increasing per upload key. We use
            # the GitHub Actions run number, which is unique per workflow run
            # across the repo and always goes up.
            # versionName: tag for tag-triggered runs, "dev-<sha>" for manual.
            - name: Determine version
              id: version
              run: |
                  TAG_INPUT='${{ github.event.inputs.tag }}'
                  REF_NAME='${{ github.ref_name }}'
                  if [[ -n "${TAG_INPUT}" ]]; then
                    VERSION_NAME="${TAG_INPUT}"
                  elif [[ "${REF_NAME}" == v* ]]; then
                    VERSION_NAME="${REF_NAME}"
                  else
                    VERSION_NAME="dev-$(git rev-parse --short HEAD)"
                  fi
                  echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
                  echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

            - name: Inject versionCode/versionName into app/build.gradle
              working-directory: src/waqd_website/ui/android
              run: |
                  python3 - <<'PY'
                  import os, re
                  p = "app/build.gradle"
                  with open(p) as f:
                      txt = f.read()
                  txt = re.sub(
                      r"versionCode\s+\d+",
                      f"versionCode {os.environ['VERSION_CODE']}",
                      txt,
                  )
                  txt = re.sub(
                      r'versionName\s+"[^"]+"',
                      f'versionName "{os.environ["VERSION_NAME"]}"',
                      txt,
                  )
                  with open(p, "w") as f:
                      f.write(txt)
                  PY
              env:
                  VERSION_NAME: ${{ steps.version.outputs.version_name }}
                  VERSION_CODE: ${{ steps.version.outputs.version_code }}

            # ---------- Signing material (only at build time, never committed) ----------
            - name: Decode keystore
              working-directory: src/waqd_website/ui/android
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  # The keystore lives at android/waqd-release.jks (one level above app/,
                  # to match the existing local keystore.properties: storeFile=../waqd-release.jks).
                  echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > waqd-release.jks
                  # sanity check: file must be a valid keystore
                  keytool -list -keystore waqd-release.jks \
                    -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null

            - name: Write keystore.properties
              working-directory: src/waqd_website/ui/android
              run: |
                  cat > keystore.properties <<EOF
                  keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
                  keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
                  storeFile=../waqd-release.jks
                  storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  EOF

            # ---------- Build ----------
            # `release:android` does: vite build (skipping optimize-images
            # via the dedicated chain), strip dist/static, cap sync android,
            # then gradlew assembleRelease. The keystore.properties written
            # above is consumed by gradle, and the versionCode/versionName
            # patches applied to app/build.gradle above are used by the
            # :app:assembleRelease task.
            - name: Assemble signed release APK
              working-directory: src/waqd_website/ui
              run: npm run release:android

            # ---------- Locate + verify + rename ----------
            - name: Find built APK
              id: find_apk
              working-directory: src/waqd_website/ui/android
              run: |
                  APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
                  if [[ -z "${APK}" ]]; then
                    echo "No APK found in app/build/outputs/apk/release" >&2
                    ls -R app/build/outputs || true
                    exit 1
                  fi
                  # Copy to a stable, canonical name so the GitHub Release asset
                  # URL is predictable (waqd-app-release.apk).
                  cp "${APK}" "waqd-app-release.apk"
                  echo "apk_path=waqd-app-release.apk" >> "$GITHUB_OUTPUT"
                  ls -la "${APK}" "waqd-app-release.apk"

            - name: Verify APK signature
              working-directory: src/waqd_website/ui/android
              run: |
                  BUILD_TOOLS_VERSION=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
                  "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" \
                    verify --print-certs "waqd-app-release.apk"

            # ---------- Upload ----------
            # 1. Delete any existing APK/AAB on the release (so the new build
            #    effectively "overwrites" the previous binary).
            # 2. Upload the freshly built APK. action-gh-release will create the
            #    release if it doesn't exist yet.
            - name: Delete previous APK/AAB assets from the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.version.outputs.version_name }}
              run: |
                  set +e
                  # Match the canonical name we upload, plus any historical names
                  # (default AGP output `app-release.apk`, anything ending in .apk/.aab).
                  ASSETS=$(gh release view "${TAG}" --json assets --jq '.assets[].name' 2>/dev/null)
                  for a in ${ASSETS}; do
                    case "${a}" in
                      waqd-app-release.apk|app-release.apk|*.apk|*.aab)
                        echo "Removing existing artifact: ${a}"
                        gh release delete-asset "${TAG}" "${a}" --yes
                        ;;
                    esac
                  done

            - name: Upload APK to release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.version_name }}
                  name: ${{ steps.version.outputs.version_name }}
                  generate_release_notes: true
                  fail_on_unmatched_files: false
                  files: src/waqd_website/ui/android/${{ steps.find_apk.outputs.apk_path }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
