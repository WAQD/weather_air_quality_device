name: CI

# Runner infos
# Runner: waqd-x64-runner (labels: self-hosted, Linux, X64)
# Runner: waqd-arm64-runner (labels: self-hosted, Linux, ARM64, ARM, aarch64)

on:
  push:
    branches: [master]
    paths:
      - "**"
      - "!/*.md"
      - "!/doc/**"
      - "!/script/**"
      - "!/LICENSE"
      - "!/TODO"
      - ".github/workflows/ci.yml"
    tags:
      - "v*"
  pull_request:
    branches: [master]
    paths:
      - "**"
      - "!/*.md"
      - "!/doc/**"
      - "!/script/**"
      - "!/LICENSE"
      - "!/TODO"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  # Decide whether publishing the website image is meaningful for this change.
  # Test jobs still run for test-only changes; only the image build/publish is
  # skipped when none of its inputs changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Docker image changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - "src/waqd_website/**"
              - "src/waqd/**"
              - "src/waqd_assets/**"
              - "src/waqd_website/Dockerfile"
              - "pyproject.toml"
              - "pdm.lock"
              - ".dockerignore"

  test-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/waqd_website/ui/package-lock.json

      - name: Install dependencies
        working-directory: src/waqd_website/ui
        run: npm ci

      - name: Run unit tests
        working-directory: src/waqd_website/ui
        run: npm run test:unit

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb vlc libvlc-dev

      - name: Cache PDM dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pdm
            .venv
          key: pdm-${{ runner.os }}-${{ hashFiles('pdm.lock') }}
          restore-keys: |
            pdm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install --frozen-lockfile -G test -G waqd

      - name: Run Python tests
        run: xvfb-run -a env PYTHONPATH=src pdm run pytest test/basics test/waqd_station/components -m "not hardware and not integration" -q --timeout=60

  # Installer tests run in an isolated Debian Trixie container because they
  # manipulate LXDE autostart files, unattended-upgrades configs, and pipx
  # paths, and shell out via `sudo` — they must not touch the runner host.
  test-installer:
    runs-on: [self-hosted, Linux, aarch64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build installer test image
        run: |
          docker build -t waqd-installer-test \
            -f test/waqd_station/Dockerfile.test .

      - name: Run installer tests in container
        # Install deps and run pytest in a SINGLE docker run so the venv
        # persists between the install and the test invocation.
        run: |
          docker run --rm \
            -v "$PWD":/waqd \
            -e SUDO_USER=root \
            -e PYTHONPATH=/waqd/src \
            waqd-installer-test \
            bash -c "pdm install -G test && pdm run pytest test/waqd_station/test_installer.py -q --timeout=60"

  # Hardware tests drive the real sensor drivers on a Raspberry Pi with
  # physical sensors wired up. DISABLED until the sensors are physically
  # connected and verified — re-enable by uncommenting this job and running
  # via workflow_dispatch. Gated by WAQD_HW_CONNECTED=1 on top of the
  # @pytest.mark.hardware marker.
  # test-hardware:
  #   runs-on: [self-hosted, Linux, ARM64]
  #   if: github.event_name == 'workflow_dispatch'
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v7
  #
  #     - name: Set up Python
  #       uses: actions/setup-python@v7
  #       with:
  #         python-version: "3.14"
  #
  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install pdm
  #         pdm install --frozen-lockfile -G test -G waqd
  #
  #     - name: Run hardware tests
  #       env:
  #         WAQD_HW_CONNECTED: "1"
  #       run: PYTHONPATH=src pdm run pytest test/waqd_station/hardware -q --timeout=60

  build:
    needs: [changes, test-node, test-python, test-installer]
    # Tags and manual runs remain explicit build requests. On normal pushes
    # and pull requests, publish only when image inputs changed.
    if: >-
      always() &&
      (needs.changes.outputs.docker == 'true' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch') &&
      needs.test-node.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-installer.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version_comment: ${{ steps.set_tag.outputs.version_comment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version comment
        id: set_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version_comment=# Version: ${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Get package.json version
        id: package_version
        run: |
          VERSION=$(node -p "require('./src/waqd_website/ui/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build Docker image
        id: build_image
        run: |
          VCS_REF=$(git rev-parse --short=6 HEAD)
          IMAGE_TAG="v${{ steps.package_version.outputs.version }}-${VCS_REF}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          TAGS="-t goszpeti/waqd_website:latest -t goszpeti/waqd_website:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg VCS_REF=$VCS_REF \
            --build-arg VERSION=$(git describe --tags || echo "dev") \
            $TAGS \
            --load \
            -f src/waqd_website/Dockerfile \
            .

      - name: Push Docker image
        run: |
          echo ${{ secrets.DOCKER_ACCESS_TOKEN }} | docker login -u goszpeti --password-stdin
          docker push goszpeti/waqd_website:latest
          docker push goszpeti/waqd_website:${{ steps.build_image.outputs.image_tag }}

