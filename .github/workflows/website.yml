name: Build waqd_website Docker Image

on:
  push:
    branches: [master]
    paths:
      - "src/waqd_website/**"
      - "src/waqd/**"
      - "src/waqd_assets/**"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
    tags:
      - "v*"
  pull_request:
    branches: [master]
    paths:
      - "src/waqd_website/**"
      - "src/waqd/**"
      - "src/waqd_assets/**"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/waqd_website/ui/package-lock.json

      - name: Install dependencies
        working-directory: src/waqd_website/ui
        run: npm ci

      - name: Run unit tests
        working-directory: src/waqd_website/ui
        run: npm run test:unit

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version_comment: ${{ steps.set_tag.outputs.version_comment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version comment
        id: set_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version_comment=# Version: ${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Get package.json version
        id: package_version
        run: |
          VERSION=$(node -p "require('./src/waqd_website/ui/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          TAGS="-t goszpeti/waqd_website:latest"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAGS="$TAGS -t goszpeti/waqd_website:${{ steps.package_version.outputs.version }}"
          fi
          VCS_REF=$(git rev-parse --short=6 HEAD)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg VCS_REF=$VCS_REF \
            --build-arg VERSION=$(git describe --tags || echo "dev") \
            $TAGS \
            --load \
            -f src/waqd_website/Dockerfile \
            .

      - name: Push Docker image
        run: |
          echo ${{ secrets.DOCKER_ACCESS_TOKEN }} | docker login -u goszpeti --password-stdin
          docker push goszpeti/waqd_website:latest
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            docker push goszpeti/waqd_website:${{ steps.package_version.outputs.version }}
          fi

